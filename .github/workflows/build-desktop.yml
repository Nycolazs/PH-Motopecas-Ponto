name: Build Desktop Clients

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows (x64)
            os: windows-latest
            package_cmd: pnpm package:windows
            artifact_pattern: |
              apps/desktop/release/PH-Ponto-Setup-*.exe
              apps/desktop/release/PH-Ponto-Setup-*.exe.blockmap
              apps/desktop/release/latest.yml
              apps/desktop/release/SHA256SUMS-win32.txt
            artifact_name: PH-Ponto-Windows-x64

          - name: macOS (Apple Silicon & Intel)
            os: macos-latest
            package_cmd: pnpm package:mac
            artifact_pattern: |
              apps/desktop/release/PH-Ponto-*.dmg
              apps/desktop/release/PH-Ponto-*.zip
              apps/desktop/release/PH-Ponto-*.blockmap
              apps/desktop/release/latest-mac.yml
              apps/desktop/release/SHA256SUMS-darwin.txt
            artifact_name: PH-Ponto-macOS

          - name: Linux (AppImage & DEB)
            os: ubuntu-latest
            package_cmd: pnpm package:linux
            artifact_pattern: |
              apps/desktop/release/PH-Ponto-*.AppImage
              apps/desktop/release/PH-Ponto-*.deb
              apps/desktop/release/latest-linux.yml
              apps/desktop/release/SHA256SUMS-linux.txt
            artifact_name: PH-Ponto-Linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          fetch-depth: 0

      - name: Checkout submodules
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || github.token }}
        run: |
          git config core.quotepath false
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test:frontend

      - name: Verify release tag and dependency security
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node -e 'const p = require("./apps/desktop/package.json"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Release tag does not match desktop version");'
          fi
          pnpm audit --audit-level=high

      - name: Package Desktop Client (${{ matrix.platform.name }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.platform.package_cmd }}

      - name: Verify update manifests and artifact checksums
        run: pnpm --filter @ph-ponto/desktop exec node scripts/verify-release.mjs

      - name: Smoke test the Windows installer
        if: runner.os == 'Windows'
        run: pnpm --filter @ph-ponto/desktop exec node scripts/smoke-windows-release.mjs

      - name: Upload Artifact (${{ matrix.platform.name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_pattern }}
          if-no-files-found: error

      - name: Upload Windows smoke evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-smoke-evidence
          path: apps/desktop/release-smoke/
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: PH-Ponto-*

      - name: Create Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
