name: Demo images (Raspberry Pi)

on:
  push:
    branches: [demo-pi]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build ${{ matrix.image.name }} (linux/arm64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, dockerfile: apps/api/Dockerfile, target: runtime }
          - { name: seed, dockerfile: apps/api/Dockerfile, target: build }
          - { name: web, dockerfile: deploy/pi/web.Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/nycolazs/ph-ponto-demo-${{ matrix.image.name }}:latest
            ghcr.io/nycolazs/ph-ponto-demo-${{ matrix.image.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=demo-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.image.name }}
