packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
trustLockfile: true

overrides:
  'js-yaml@>=5.0.0 <5.2.2': 5.3.0
  'deepmerge-ts@<8.0.0': 8.0.1
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  '@xmldom/xmldom@>=0.7.0 <0.8.15': 0.8.15
  'mysql2@<3.22.0': 3.22.0
  'multer@<2.3.0': 2.3.0

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  electron: true
  electron-winstaller: true
  esbuild: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.1'
  - '@nestjs/core@11.2.1'
  - '@nestjs/platform-express@11.2.1'
  - '@nestjs/testing@11.2.1'
  - js-yaml@5.3.0
  - deepmerge-ts@8.0.1
