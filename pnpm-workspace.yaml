packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
trustLockfile: true

overrides:
  'js-yaml@>=5.0.0 <5.2.2': 5.3.0
  'deepmerge-ts@<8.0.0': 8.0.1
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  '@xmldom/xmldom@>=0.7.0 <0.8.15': 0.8.15
  'mysql2@<3.22.0': 3.22.0
  'multer@<2.3.0': 2.3.0
  'axios@>=1.13.0 <1.20.0': 1.20.0
  'brace-expansion@<1.1.20': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.6': 2.1.7
  'brace-expansion@>=4.0.0 <5.0.10': 5.0.12
  'undici@>=6.7.0 <6.28.1': 6.29.0
  'undici@>=7.0.0 <7.29.1': 7.30.0
  'joi@>=18.0.0 <18.2.6': 18.2.9

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  electron: true
  electron-winstaller: true
  esbuild: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.1'
  - '@nestjs/core@11.2.1'
  - '@nestjs/platform-express@11.2.1'
  - '@nestjs/testing@11.2.1'
  - js-yaml@5.3.0
  - deepmerge-ts@8.0.1
  - electron@43.7.7
