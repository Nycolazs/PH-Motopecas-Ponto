packages:
  - PH-Motopeças-Ponto-Backend
  - PH-Motopeças-Ponto-Frontend
  - packages/*

injectWorkspacePackages: true
trustLockfile: true

overrides:
  'js-yaml@>=5.0.0 <5.2.2': 5.3.0

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  electron: true
  electron-winstaller: true
  esbuild: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.1'
  - '@nestjs/core@11.2.1'
  - '@nestjs/platform-express@11.2.1'
  - '@nestjs/testing@11.2.1'
  - js-yaml@5.3.0
