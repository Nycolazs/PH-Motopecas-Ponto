# Raspberry Pi demo reverse proxy.
#   :80  panel + API under /api   (Cloudflare: ponto.yacacode.com -> http://localhost:8080)
#   :81  API only, with or without the /api prefix (published as host port 3000)

# The API only accepts web logins from an exact, configured Origin. A same-origin request
# (Origin host == Host header) is normalised to the public origin, so the panel also works
# through Tailscale or the LAN; cross-site origins pass through untouched and are refused.
map "$http_origin|$http_host" $api_origin {
    "~^https?://([^/|]+)\|\1$" "https://ponto.yacacode.com";
    default $http_origin;
}

map $http_x_forwarded_proto $forwarded_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
}

upstream api_upstream {
    server api:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location = /api { return 308 /api/; }

    location /api/ {
        proxy_pass http://api_upstream/;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # nginx has no MIME type for .mjs; the pdf.js worker is an ES module.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

server {
    listen 81;
    server_name _;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api_upstream/;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location / {
        proxy_pass http://api_upstream;
        include /etc/nginx/conf.d/api-proxy.inc;
    }
}
