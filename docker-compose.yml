name: ph-ponto

services:
  postgres:
    image: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
    command: ['postgres', '-c', 'timezone=UTC']
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ph_ponto}
      POSTGRES_USER: ${POSTGRES_USER:-ph_ponto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ph_ponto_dev}
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ph_ponto}:${POSTGRES_PASSWORD:-ph_ponto_dev}@postgres:5432/${POSTGRES_DB:-ph_ponto}?schema=public
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-development-access-secret-change-before-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-refresh-secret-change-before-production}
      # Encrypts every stored PDF. Production must set its own key in .env and back it up.
      DOCUMENTS_ENCRYPTION_KEY: ${DOCUMENTS_ENCRYPTION_KEY:-ZGV2ZWxvcG1lbnQtZG9jdW1lbnRzLWtleS0zMmJ5dGU=}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-development-bootstrap-password-change-me}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN:-http://localhost:5173}
      DESKTOP_DEV_ORIGIN: ${DESKTOP_DEV_ORIGIN:-http://localhost:5173}
      UPLOAD_DIR: /data/uploads
      # Behind the Cloudflare Tunnel every request reaches the API from the Docker gateway;
      # trusting it lets login rate limiting see each person's real address.
      TRUST_PROXY_ADDRESSES: ${TRUST_PROXY_ADDRESSES:-}
      OPENWA_BASE_URL: ${OPENWA_BASE_URL:-http://openwa:2785}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
    ports:
      # Production sets API_BIND_IP=0.0.0.0 in .env so the LAN/Tailscale can reach it.
      - '${API_BIND_IP:-127.0.0.1}:${API_PORT:-3000}:3000'
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Self-hosted WhatsApp gateway used for late-arrival alerts. Reachable only from
  # the compose network; the store's number is paired through the admin panel.
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.23.4
    restart: unless-stopped
    profiles: ['whatsapp']
    environment:
      NODE_ENV: production
      PORT: '2785'
      LOG_LEVEL: info
      LOG_FORMAT: json
      AUTO_START_SESSIONS: 'true'
      API_MASTER_KEY: ${OPENWA_API_KEY:-}
    volumes:
      - openwa_data:/app/data
    shm_size: 512mb
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:2785/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/desktop/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-5173}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  uploads_data:
  openwa_data:
